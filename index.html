<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz App</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app">
<section id="start">
<h1>Quiz de cultura general</h1>
<p>6 preguntas de opción múltiple. Cada respuesta correcta suma 1 punto. Tienes 1 minuto por pregunta: si se acaba el tiempo, pasas a la siguiente y pierdes 1 punto.</p>
<button id="start-btn" type="button">Empezar</button>
</section>
<section id="quiz" hidden>
<div class="card">
<p class="meta"><span id="progress"></span> <span id="timer" role="timer"></span></p>
<h2 id="question"></h2>
<div id="answers" class="answers"></div>
<p id="feedback" aria-live="polite"></p>
<button id="next-btn" type="button" hidden>Siguiente</button>
</div>
</section>
<section id="result" hidden>
<h1>Resultado final</h1>
<p class="score">Puntaje: <strong id="score"></strong></p>
<ol id="results" class="results"></ol>
<button id="restart-btn" type="button">Volver a empezar</button>
</section>
</main>
<script src="js/questions.js"></script>
<script src="js/script.js"></script>
</body>
</html>
